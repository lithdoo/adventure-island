name: Agent Runner OpenCode Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-runner-opencode-diagnostic.yml"

concurrency:
  group: agent-implement-agent/pilot-design
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose local OpenCode execution
    runs-on: [self-hosted]
    timeout-minutes: 10

    steps:
      - name: Inspect staged OpenCode and credential visibility
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "64-bit OS: $([System.Environment]::Is64BitOperatingSystem)"
          Write-Host "64-bit process: $([System.Environment]::Is64BitProcess)"
          Write-Host "Processor architecture env: $env:PROCESSOR_ARCHITECTURE"

          try {
            $cpu = Get-CimInstance Win32_Processor -ErrorAction Stop | Select-Object -First 1
            Write-Host "CPU: $($cpu.Name)"
          } catch {
            Write-Host "CPU query unavailable: $($_.Exception.Message)"
          }

          $cacheBase = $env:RUNNER_TOOL_CACHE
          if (-not $cacheBase) {
            $workRoot = Split-Path -Parent $env:RUNNER_TEMP
            $cacheBase = Join-Path $workRoot "_tool"
          }

          $cacheRoot = Join-Path $cacheBase "adventure-island\opencode-v2"
          $staging = "$cacheRoot.staging"
          $payload = Join-Path $staging "payload"

          $candidate = Get-ChildItem -LiteralPath $payload -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @("opencode.exe", "opencode2.exe") } |
            Select-Object -First 1

          if (-not $candidate) {
            Write-Host "No staged OpenCode executable found."
          } else {
            Write-Host "Candidate name: $($candidate.Name)"
            Write-Host "Candidate size: $($candidate.Length) bytes"

            try {
              $sig = Get-AuthenticodeSignature -LiteralPath $candidate.FullName -ErrorAction Stop
              Write-Host "Authenticode status: $($sig.Status)"
            } catch {
              Write-Host "Authenticode query failed: $($_.Exception.Message)"
            }

            try {
              $zone = Get-Item -LiteralPath $candidate.FullName -Stream Zone.Identifier -ErrorAction Stop
              Write-Host "Zone.Identifier present: true"
            } catch {
              Write-Host "Zone.Identifier present: false"
            }

            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $candidate.FullName
            $psi.Arguments = "--version"
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.CreateNoWindow = $true

            try {
              $process = New-Object System.Diagnostics.Process
              $process.StartInfo = $psi
              $started = $process.Start()
              Write-Host "Process Start returned: $started"
              if ($started) {
                $stdout = $process.StandardOutput.ReadToEnd()
                $stderr = $process.StandardError.ReadToEnd()
                $process.WaitForExit()
                Write-Host "Process exit code: $($process.ExitCode)"
                if ($stdout) {
                  Write-Host "stdout: $($stdout.Trim())"
                }
                if ($stderr) {
                  Write-Host "stderr: $($stderr.Trim())"
                }
              }
            } catch [System.ComponentModel.Win32Exception] {
              Write-Host "Win32Exception type: $($_.Exception.GetType().FullName)"
              Write-Host "Win32Exception message: $($_.Exception.Message)"
              Write-Host "Win32 native error: $($_.Exception.NativeErrorCode)"
              Write-Host "Win32 HResult: $($_.Exception.HResult)"
            } catch {
              Write-Host "Execution exception type: $($_.Exception.GetType().FullName)"
              Write-Host "Execution exception message: $($_.Exception.Message)"
              Write-Host "Execution HResult: $($_.Exception.HResult)"
              if ($_.Exception.InnerException) {
                Write-Host "Execution inner exception: $($_.Exception.InnerException.Message)"
              }
            }
          }

          function Test-RegistryEnvironmentName {
            param([string]$Name)

            foreach ($path in @(
              "HKCU:\Environment",
              "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment"
            )) {
              try {
                $value = (Get-ItemProperty -Path $path -Name $Name -ErrorAction Stop).$Name
                if ($value) { return $true }
              } catch {}
            }

            try {
              foreach ($hive in (Get-ChildItem "Registry::HKEY_USERS" -ErrorAction Stop)) {
                $leaf = $hive.PSChildName
                if (-not $leaf -or $leaf.EndsWith("_Classes")) { continue }
                try {
                  $path = "Registry::HKEY_USERS\$leaf\Environment"
                  $value = (Get-ItemProperty -Path $path -Name $Name -ErrorAction Stop).$Name
                  if ($value) { return $true }
                } catch {}
              }
            } catch {}

            return $false
          }

          foreach ($name in @("GLM_API_KEY", "ZAI_API_KEY", "ZHIPU_API_KEY")) {
            $processValue = [Environment]::GetEnvironmentVariable($name, "Process")
            $processPresent = -not [string]::IsNullOrEmpty($processValue)
            $registryPresent = Test-RegistryEnvironmentName $name
            Write-Host "$name process-present: $processPresent"
            Write-Host "$name registry-present: $registryPresent"
          }

          if (Test-Path -LiteralPath "F:\CMS079" -PathType Container) {
            try {
              $sample = Get-ChildItem -LiteralPath "F:\CMS079" -Force -ErrorAction Stop | Select-Object -First 1
              Write-Host "CMS079 readable: $($null -ne $sample)"
            } catch {
              Write-Host "CMS079 readable: false"
            }
          } else {
            Write-Host "CMS079 readable: false"
          }
