name: Agent Implement

on:
  workflow_run:
    workflows: ["Agent Spec Gate"]
    types: [completed]

concurrency:
  group: agent-implement-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  preflight:
    name: Revalidate and package trusted inputs
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      allowed: ${{ steps.validate.outputs.allowed }}
      pr_number: ${{ steps.validate.outputs.pr_number }}
      spec_path: ${{ steps.validate.outputs.spec_path }}
      head_sha: ${{ steps.validate.outputs.head_sha }}
      base_sha: ${{ steps.base.outputs.sha }}

    steps:
      - name: Checkout trusted main with read-only submodule context
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          persist-credentials: false

      - name: Record trusted implementation base
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Revalidate PR and task
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          echo "allowed=false" >> "$GITHUB_OUTPUT"

          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          trigger_head="$(jq -r '.workflow_run.pull_requests[0].head.sha // empty' "$GITHUB_EVENT_PATH")"

          if [[ -z "$pr_number" ]]; then
            echo "No pull request is associated with the completed gate run."
            exit 0
          fi

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"

          state="$(jq -r '.state' <<<"$pr_json")"
          draft="$(jq -r '.draft' <<<"$pr_json")"
          author="$(jq -r '.user.login' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          changed_files="$(jq -r '.changed_files' <<<"$pr_json")"

          if [[ "$state" != "open" || "$draft" != "false" ]]; then
            echo "Design PR is no longer open and ready."
            exit 0
          fi
          if [[ "$author" != "$REPOSITORY_OWNER" || "$head_repo" != "$REPOSITORY" ]]; then
            echo "Design PR is not an owner-authored same-repository PR."
            exit 0
          fi
          if [[ "$base_ref" != "main" ]]; then
            echo "Design PR no longer targets main."
            exit 0
          fi
          if [[ -n "$trigger_head" && "$trigger_head" != "$head_sha" ]]; then
            echo "Ignoring stale gate run for $trigger_head; current head is $head_sha."
            exit 0
          fi
          if [[ "$changed_files" != "1" ]]; then
            echo "Design PR must change exactly one file."
            exit 0
          fi

          spec_path="$(
            gh api "repos/$REPOSITORY/pulls/$pr_number/files?per_page=100" \
              --jq '.[0].filename'
          )"

          if [[ ! "$spec_path" =~ ^task/dev/[^/]+\.md$ || "$spec_path" == "task/dev/README.md" ]]; then
            echo "Unexpected design path: $spec_path"
            exit 0
          fi

          gh api "repos/$REPOSITORY/contents/$spec_path?ref=$head_sha" \
            --jq '.content' \
            | tr -d '\n' \
            | base64 --decode \
            > "$RUNNER_TEMP/agent-spec.md"

          python3 scripts/agent/validate_spec.py "$RUNNER_TEMP/agent-spec.md"

          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "spec_path=$spec_path" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Stage trusted source snapshot
        if: ${{ steps.validate.outputs.allowed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/agent-source"
          mkdir -p "$RUNNER_TEMP/agent-source"
          rsync -a --exclude='.git' ./ "$RUNNER_TEMP/agent-source/"

      - name: Upload trusted source snapshot
        if: ${{ steps.validate.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-source
          path: ${{ runner.temp }}/agent-source
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload approved design document
        if: ${{ steps.validate.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-spec
          path: ${{ runner.temp }}/agent-spec.md
          if-no-files-found: error
          retention-days: 1

      - name: Download official portable OpenCode V2 for Windows x64
        if: ${{ steps.validate.outputs.allowed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://opencode.ai/update/api/latest/cli/opencode/opencode-windows-x64.zip"
          output="$RUNNER_TEMP/opencode-windows-x64.zip"

          curl --fail --location --retry 3 --retry-all-errors \
            --output "$output" \
            "$url"

          python3 -m zipfile -t "$output"
          sha256sum "$output" | tee "$RUNNER_TEMP/opencode.sha256"
          printf 'Portable OpenCode archive: `%s`\n' "$(cat "$RUNNER_TEMP/opencode.sha256")" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload portable OpenCode CLI
        if: ${{ steps.validate.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-opencode
          path: |
            ${{ runner.temp }}/opencode-windows-x64.zip
            ${{ runner.temp }}/opencode.sha256
          if-no-files-found: error
          retention-days: 1

  implement:
    name: Implement with local OpenCode
    needs: preflight
    if: ${{ needs.preflight.outputs.allowed == 'true' }}
    runs-on: [self-hosted]
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read

    steps:
      - name: Reset isolated agent directories
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("agent-workspace", "agent-input", "agent-output", "agent-tool", "trusted-agent")) {
            $path = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
            New-Item -ItemType Directory -Path $path -Force | Out-Null
          }

      - name: Download trusted source snapshot
        uses: actions/download-artifact@v4
        with:
          name: agent-source
          path: ${{ runner.temp }}/agent-workspace

      - name: Download approved design document
        uses: actions/download-artifact@v4
        with:
          name: agent-spec
          path: ${{ runner.temp }}/agent-input

      - name: Download portable OpenCode CLI
        uses: actions/download-artifact@v4
        with:
          name: agent-opencode
          path: ${{ runner.temp }}/agent-tool

      - name: Create local baseline and trusted verifier snapshot
        shell: powershell
        working-directory: ${{ runner.temp }}/agent-workspace
        run: |
          $ErrorActionPreference = "Stop"

          git init
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name "agent-baseline"
          git config user.email "agent-baseline@localhost"
          git add -f -A
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "agent trusted baseline"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $trusted = Join-Path $env:RUNNER_TEMP "trusted-agent"
          Copy-Item -Path (Join-Path (Get-Location) "scripts\agent\*") -Destination $trusted -Recurse -Force

          if (Test-Path -LiteralPath ".raw") {
            throw ".raw must not exist inside the self-hosted agent workspace."
          }

      - name: Prepare portable OpenCode installation
        shell: powershell
        working-directory: ${{ runner.temp }}/agent-workspace
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Windows PowerShell $($PSVersionTable.PSVersion)"

          $toolRoot = Join-Path $env:RUNNER_TEMP "agent-tool"
          $archive = Join-Path $toolRoot "opencode-windows-x64.zip"
          $extract = Join-Path $toolRoot "opencode"

          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Portable OpenCode archive was not downloaded."
          }

          if (Test-Path -LiteralPath $extract) {
            Remove-Item -LiteralPath $extract -Recurse -Force
          }
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force

          $bin = Get-ChildItem -LiteralPath $extract -Recurse -File |
            Where-Object { $_.Name -in @("opencode.exe", "opencode2.exe") } |
            Select-Object -First 1

          if (-not $bin) {
            throw "Portable OpenCode archive does not contain opencode.exe/opencode2.exe."
          }

          $version = (& $bin.FullName --version 2>&1 | Select-Object -First 1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Portable OpenCode failed its --version check."
          }

          "OPENCODE_BIN=$($bin.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Portable OpenCode ready: $version"

      - name: Run OpenCode implementation
        shell: powershell
        working-directory: ${{ runner.temp }}/agent-workspace
        env:
          DESIGN_PR: ${{ needs.preflight.outputs.pr_number }}
        run: |
          $ErrorActionPreference = "Stop"
          $runner = Join-Path $env:RUNNER_TEMP "trusted-agent\run-opencode.ps1"
          $spec = Join-Path $env:RUNNER_TEMP "agent-input\agent-spec.md"

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $runner -SpecPath $spec -DesignPr ([int]$env:DESIGN_PR)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify agent output
        shell: powershell
        working-directory: ${{ runner.temp }}/agent-workspace
        run: |
          $ErrorActionPreference = "Stop"
          $verifier = Join-Path $env:RUNNER_TEMP "trusted-agent\verify.ps1"
          $spec = Join-Path $env:RUNNER_TEMP "agent-input\agent-spec.md"

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $verifier -SpecPath $spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize verified patch
        shell: powershell
        working-directory: ${{ runner.temp }}/agent-workspace
        run: |
          $ErrorActionPreference = "Stop"
          $patch = Join-Path $env:RUNNER_TEMP "agent-output\agent.patch"

          git add -N -- .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git diff --binary "--output=$patch" HEAD --
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path -LiteralPath $patch) -or (Get-Item -LiteralPath $patch).Length -eq 0) {
            throw "Verified agent patch is empty."
          }

      - name: Upload verified patch
        uses: actions/upload-artifact@v4
        with:
          name: agent-patch
          path: ${{ runner.temp }}/agent-output/agent.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish implementation PR
    needs: [preflight, implement]
    if: ${{ needs.preflight.outputs.allowed == 'true' && needs.implement.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
      - name: Checkout trusted implementation base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified patch
        uses: actions/download-artifact@v4
        with:
          name: agent-patch
          path: ${{ runner.temp }}/agent-output

      - name: Apply patch and publish
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          DESIGN_PR: ${{ needs.preflight.outputs.pr_number }}
          DESIGN_HEAD: ${{ needs.preflight.outputs.head_sha }}
          BRANCH: agent/pr-${{ needs.preflight.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          git checkout -B "$BRANCH"
          git apply --index "$RUNNER_TEMP/agent-output/agent.patch"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(agent): implement design PR #$DESIGN_PR"

          auth="$(
            printf 'x-access-token:%s' "$GITHUB_TOKEN" \
              | base64 \
              | tr -d '\n'
          )"

          GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
            git \
              -c credential.helper= \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
              push --force origin "HEAD:refs/heads/$BRANCH"

          result="$(
            python3 scripts/agent/github_api.py publish \
              --repo "$REPOSITORY" \
              --design-pr "$DESIGN_PR" \
              --design-sha "$DESIGN_HEAD" \
              --branch "$BRANCH" \
              --base main
          )"

          printf '%s\n' "$result"
          printf 'Implementation publication: `%s`\n' "$result" >> "$GITHUB_STEP_SUMMARY"
