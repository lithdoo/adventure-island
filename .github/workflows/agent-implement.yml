name: Agent Implement

on:
  workflow_run:
    workflows: ["Agent Spec Gate"]
    types: [completed]

concurrency:
  group: agent-implement-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  preflight:
    name: Revalidate and package trusted inputs
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      allowed: ${{ steps.validate.outputs.allowed }}
      pr_number: ${{ steps.validate.outputs.pr_number }}
      spec_path: ${{ steps.validate.outputs.spec_path }}
      head_sha: ${{ steps.validate.outputs.head_sha }}
      base_sha: ${{ steps.base.outputs.sha }}

    steps:
      - name: Checkout trusted main with read-only submodule context
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          persist-credentials: false

      - name: Record trusted implementation base
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Revalidate PR and task
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          echo "allowed=false" >> "$GITHUB_OUTPUT"

          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          trigger_head="$(jq -r '.workflow_run.pull_requests[0].head.sha // empty' "$GITHUB_EVENT_PATH")"

          if [[ -z "$pr_number" ]]; then
            echo "No pull request is associated with the completed gate run."
            exit 0
          fi

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
          state="$(jq -r '.state' <<<"$pr_json")"
          draft="$(jq -r '.draft' <<<"$pr_json")"
          author="$(jq -r '.user.login' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          changed_files="$(jq -r '.changed_files' <<<"$pr_json")"

          if [[ "$state" != "open" || "$draft" != "false" ]]; then
            echo "Design PR is no longer open and ready."
            exit 0
          fi
          if [[ "$author" != "$REPOSITORY_OWNER" || "$head_repo" != "$REPOSITORY" ]]; then
            echo "Design PR is not an owner-authored same-repository PR."
            exit 0
          fi
          if [[ "$base_ref" != "main" ]]; then
            echo "Design PR no longer targets main."
            exit 0
          fi
          if [[ -n "$trigger_head" && "$trigger_head" != "$head_sha" ]]; then
            echo "Ignoring stale gate run for $trigger_head; current head is $head_sha."
            exit 0
          fi
          if [[ "$changed_files" != "1" ]]; then
            echo "Design PR must change exactly one file."
            exit 0
          fi

          spec_path="$(
            gh api "repos/$REPOSITORY/pulls/$pr_number/files?per_page=100" \
              --jq '.[0].filename'
          )"
          if [[ ! "$spec_path" =~ ^task/dev/[^/]+\.md$ || "$spec_path" == "task/dev/README.md" ]]; then
            echo "Unexpected design path: $spec_path"
            exit 0
          fi

          gh api "repos/$REPOSITORY/contents/$spec_path?ref=$head_sha" \
            --jq '.content' \
            | tr -d '\n' \
            | base64 --decode \
            > "$RUNNER_TEMP/agent-spec.md"

          python3 scripts/agent/validate_spec.py "$RUNNER_TEMP/agent-spec.md"

          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "spec_path=$spec_path" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Stage trusted source snapshot
        if: ${{ steps.validate.outputs.allowed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/agent-source"
          mkdir -p "$RUNNER_TEMP/agent-source"
          rsync -a --exclude='.git' ./ "$RUNNER_TEMP/agent-source/"

      - name: Upload trusted source snapshot
        if: ${{ steps.validate.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-source
          path: ${{ runner.temp }}/agent-source
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload approved design document
        if: ${{ steps.validate.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-spec
          path: ${{ runner.temp }}/agent-spec.md
          if-no-files-found: error
          retention-days: 1

  implement:
    name: Implement with persistent OpenCode session
    needs: preflight
    if: ${{ needs.preflight.outputs.allowed == 'true' }}
    runs-on: [self-hosted, opencode, adventure-island]
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    env:
      OPENCODE_BIN: opencode2
      XDG_DATA_HOME: /runner/state/adventure-island/opencode-data
      AGENT_SESSION_ROOT: /runner/state/adventure-island/agent-sessions/design-${{ needs.preflight.outputs.pr_number }}
      AGENT_WORKSPACE: /runner/state/adventure-island/agent-sessions/design-${{ needs.preflight.outputs.pr_number }}/workspace

    steps:
      - name: Reset transient agent directories
        shell: bash
        run: |
          set -euo pipefail
          for name in agent-source agent-input agent-output trusted-agent; do
            path="$RUNNER_TEMP/$name"
            rm -rf "$path"
            mkdir -p "$path"
          done
          mkdir -p "$XDG_DATA_HOME" "$AGENT_SESSION_ROOT"

      - name: Download trusted source snapshot
        uses: actions/download-artifact@v4
        with:
          name: agent-source
          path: ${{ runner.temp }}/agent-source

      - name: Download approved design document
        uses: actions/download-artifact@v4
        with:
          name: agent-spec
          path: ${{ runner.temp }}/agent-input

      - name: Prepare stable session workspace and trusted verifier snapshot
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$AGENT_WORKSPACE"
          mkdir -p "$AGENT_WORKSPACE"
          cp -a "$RUNNER_TEMP/agent-source/." "$AGENT_WORKSPACE/"

          trusted="$RUNNER_TEMP/trusted-agent"
          cp -a "$AGENT_WORKSPACE/scripts/agent/." "$trusted/"

          cd "$AGENT_WORKSPACE"
          git init
          git config user.name "agent-baseline"
          git config user.email "agent-baseline@localhost"
          git add -f -A
          git commit -m "agent trusted baseline"

          if [[ -e ".raw" ]]; then
            echo ".raw must not exist inside the self-hosted agent workspace." >&2
            exit 1
          fi

      - name: Verify container OpenCode
        shell: bash
        run: |
          set -euo pipefail
          command -v "$OPENCODE_BIN" >/dev/null

          set +e
          version_output="$("$OPENCODE_BIN" --version 2>&1)"
          version_status=$?
          set -e
          if [[ $version_status -ne 0 ]]; then
            printf '%s\n' "$version_output" | sed -n '1,5p' >&2
            exit "$version_status"
          fi
          if [[ -z "${GLM_API_KEY:-}" ]]; then
            echo "GLM_API_KEY is not visible to the container runner." >&2
            exit 1
          fi
          if [[ -z "${OPENCODE_CONFIG:-}" || ! -r "$OPENCODE_CONFIG" ]]; then
            echo "Trusted OpenCode config is not readable in the container runner." >&2
            exit 1
          fi

          mkdir -p "$XDG_DATA_HOME"
          echo "Using container OpenCode: $(printf '%s\n' "$version_output" | sed -n '1p')"
          echo "OpenCode data: $XDG_DATA_HOME"
          echo "GLM_API_KEY visible: True"

      - name: Run initial OpenCode turn
        id: opencode
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "$AGENT_WORKSPACE"
          runner="$RUNNER_TEMP/trusted-agent/run-opencode.sh"
          spec="$RUNNER_TEMP/agent-input/agent-spec.md"

          bash "$runner" \
            --mode initial \
            --spec "$spec" \
            --design-pr "${{ needs.preflight.outputs.pr_number }}" \
            --design-head "${{ needs.preflight.outputs.head_sha }}" \
            --session-root "$AGENT_SESSION_ROOT" \
            --output-dir "$RUNNER_TEMP/agent-output"

      - name: Verify candidate changes
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          cd "$AGENT_WORKSPACE"
          result="$RUNNER_TEMP/agent-output/run-result.json"
          log="$RUNNER_TEMP/agent-output/verification.log"
          runtime_status="$(python3 -c 'import json,sys; p=sys.argv[1]; 
try: v=json.load(open(p, encoding="utf-8"))
except Exception: v={}
print(v.get("runtimeStatus") or "failed")' "$result")"
          runtime_code="$(python3 -c 'import json,sys; p=sys.argv[1]; 
try: v=json.load(open(p, encoding="utf-8"))
except Exception: v={}
print(v.get("runtimeExitCode") if v.get("runtimeExitCode") is not None else 1)' "$result")"
          changed_count="$({ git diff --name-only HEAD --; git ls-files --others --exclude-standard; } | awk 'NF' | sort -u | wc -l | tr -d ' ')"

          verification=skipped
          if [[ "$runtime_status" == "completed" && "$runtime_code" == "0" && "$changed_count" != "0" ]]; then
            set +e
            bash "$RUNNER_TEMP/trusted-agent/verify.sh" "$RUNNER_TEMP/agent-input/agent-spec.md" >"$log" 2>&1
            verify_status=$?
            set -e
            cat "$log"
            if [[ $verify_status -eq 0 ]]; then
              verification=passed
            else
              verification=failed
            fi
          else
            printf 'verification skipped: runtime=%s exit=%s changed=%s\n' \
              "$runtime_status" "$runtime_code" "$changed_count" | tee "$log"
          fi
          echo "verification=$verification" >> "$GITHUB_OUTPUT"

      - name: Finalize agent result
        id: result
        shell: bash
        run: |
          set -euo pipefail
          cd "$AGENT_WORKSPACE"
          python3 "$RUNNER_TEMP/trusted-agent/finalize_result.py" \
            --run-result "$RUNNER_TEMP/agent-output/run-result.json" \
            --verification "${{ steps.verify.outputs.verification }}" \
            --verification-log "$RUNNER_TEMP/agent-output/verification.log" \
            --output "$RUNNER_TEMP/agent-output/agent-result.json"

          status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "$RUNNER_TEMP/agent-output/agent-result.json")"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Materialize verified patch
        if: ${{ steps.result.outputs.status == 'verified' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$AGENT_WORKSPACE"
          patch="$RUNNER_TEMP/agent-output/agent.patch"
          git add -N -- .
          git diff --binary --output="$patch" HEAD --
          test -s "$patch"

      - name: Upload agent result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-result
          path: ${{ runner.temp }}/agent-output/agent-result.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload verified patch
        if: ${{ steps.result.outputs.status == 'verified' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-patch
          path: ${{ runner.temp }}/agent-output/agent.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish agent result
    needs: [preflight, implement]
    if: ${{ always() && needs.preflight.outputs.allowed == 'true' && needs.implement.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout trusted implementation base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download agent result
        uses: actions/download-artifact@v4
        with:
          name: agent-result
          path: ${{ runner.temp }}/agent-output

      - name: Inspect agent result
        id: result
        shell: bash
        run: |
          set -euo pipefail
          status="$(jq -r '.status' "$RUNNER_TEMP/agent-output/agent-result.json")"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Download verified patch
        if: ${{ steps.result.outputs.status == 'verified' }}
        uses: actions/download-artifact@v4
        with:
          name: agent-patch
          path: ${{ runner.temp }}/agent-output

      - name: Publish verified implementation or report non-publishable result
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          DESIGN_PR: ${{ needs.preflight.outputs.pr_number }}
          DESIGN_HEAD: ${{ needs.preflight.outputs.head_sha }}
          BRANCH: agent/pr-${{ needs.preflight.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/agent-output/agent-result.json"
          status="$(jq -r '.status' "$result")"

          if [[ "$status" != "verified" ]]; then
            python3 scripts/agent/github_api.py report-design \
              --repo "$REPOSITORY" \
              --design-pr "$DESIGN_PR" \
              --result "$result"
            exit 0
          fi

          patch="$RUNNER_TEMP/agent-output/agent.patch"
          test -s "$patch"
          git checkout -B "$BRANCH"
          git apply --index "$patch"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(agent): implement design PR #$DESIGN_PR"
          commit_sha="$(git rev-parse HEAD)"

          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
            git \
              -c credential.helper= \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
              push --force origin "HEAD:refs/heads/$BRANCH"

          publication="$(
            python3 scripts/agent/github_api.py publish \
              --repo "$REPOSITORY" \
              --design-pr "$DESIGN_PR" \
              --design-sha "$DESIGN_HEAD" \
              --branch "$BRANCH" \
              --base main \
              --result "$result" \
              --commit-sha "$commit_sha"
          )"
          printf '%s\n' "$publication"
          printf 'Implementation publication: `%s`\n' "$publication" >> "$GITHUB_STEP_SUMMARY"
