name: Agent Implement

on:
  workflow_run:
    workflows: ["Agent Spec Gate"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  preflight:
    name: Revalidate approved design task
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.validate.outputs.allowed }}
      pr_number: ${{ steps.validate.outputs.pr_number }}
      spec_path: ${{ steps.validate.outputs.spec_path }}
      head_sha: ${{ steps.validate.outputs.head_sha }}

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Revalidate PR and task
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          echo "allowed=false" >> "$GITHUB_OUTPUT"

          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          trigger_head="$(jq -r '.workflow_run.pull_requests[0].head.sha // empty' "$GITHUB_EVENT_PATH")"

          if [[ -z "$pr_number" ]]; then
            echo "No pull request is associated with the completed gate run."
            exit 0
          fi

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"

          state="$(jq -r '.state' <<<"$pr_json")"
          draft="$(jq -r '.draft' <<<"$pr_json")"
          author="$(jq -r '.user.login' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          changed_files="$(jq -r '.changed_files' <<<"$pr_json")"

          if [[ "$state" != "open" || "$draft" != "false" ]]; then
            echo "Design PR is no longer open and ready."
            exit 0
          fi
          if [[ "$author" != "$REPOSITORY_OWNER" || "$head_repo" != "$REPOSITORY" ]]; then
            echo "Design PR is not an owner-authored same-repository PR."
            exit 0
          fi
          if [[ "$base_ref" != "main" ]]; then
            echo "Design PR no longer targets main."
            exit 0
          fi
          if [[ -n "$trigger_head" && "$trigger_head" != "$head_sha" ]]; then
            echo "Ignoring stale gate run for $trigger_head; current head is $head_sha."
            exit 0
          fi
          if [[ "$changed_files" != "1" ]]; then
            echo "Design PR must change exactly one file."
            exit 0
          fi

          spec_path="$(
            gh api "repos/$REPOSITORY/pulls/$pr_number/files?per_page=100"               --jq '.[0].filename'
          )"

          if [[ ! "$spec_path" =~ ^task/dev/[^/]+\.md$ || "$spec_path" == "task/dev/README.md" ]]; then
            echo "Unexpected design path: $spec_path"
            exit 0
          fi

          gh api "repos/$REPOSITORY/contents/$spec_path?ref=$head_sha"             --jq '.content'             | tr -d '\n'             | base64 --decode             > "$RUNNER_TEMP/agent-spec.md"

          python3 scripts/agent/validate_spec.py "$RUNNER_TEMP/agent-spec.md"

          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "spec_path=$spec_path" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

  implement:
    name: Implement with local OpenCode
    needs: preflight
    if: ${{ needs.preflight.outputs.allowed == 'true' }}
    runs-on: [self-hosted]
    timeout-minutes: 120

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
          clean: true
          persist-credentials: false

      - name: Record trusted implementation base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git checkout -B "agent/pr-${{ needs.preflight.outputs.pr_number }}"

      - name: Fetch approved design document
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SPEC_PATH: ${{ needs.preflight.outputs.spec_path }}
          DESIGN_HEAD: ${{ needs.preflight.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/agent/github_api.py fetch-spec             --repo "$REPOSITORY"             --path "$SPEC_PATH"             --ref "$DESIGN_HEAD"             --output "$RUNNER_TEMP/agent-spec.md"
          python3 scripts/agent/validate_spec.py "$RUNNER_TEMP/agent-spec.md"

      - name: Check local OpenCode installation
        shell: bash
        run: |
          set -euo pipefail
          if command -v opencode2 >/dev/null 2>&1; then
            opencode2 --version
          elif command -v opencode >/dev/null 2>&1; then
            opencode --version
          else
            echo "Neither opencode2 nor opencode is available on the self-hosted runner." >&2
            exit 127
          fi

      - name: Run OpenCode implementation
        shell: bash
        env:
          DESIGN_PR: ${{ needs.preflight.outputs.pr_number }}
        run: |
          set -euo pipefail
          bash scripts/agent/run-opencode.sh "$RUNNER_TEMP/agent-spec.md" "$DESIGN_PR"

      - name: Verify agent output
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/agent/verify.sh "$RUNNER_TEMP/agent-spec.md"

      - name: Materialize verified patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          git add -N -- .
          git diff --binary HEAD -- > "$RUNNER_TEMP/agent.patch"
          test -s "$RUNNER_TEMP/agent.patch"
          echo "path=$RUNNER_TEMP/agent.patch" >> "$GITHUB_OUTPUT"

      - name: Publish implementation branch and PR
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          DESIGN_PR: ${{ needs.preflight.outputs.pr_number }}
          DESIGN_HEAD: ${{ needs.preflight.outputs.head_sha }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          BRANCH: agent/pr-${{ needs.preflight.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          publish_dir="$RUNNER_TEMP/agent-publish"
          rm -rf "$publish_dir"

          # Clone a fresh trusted repository after the agent process has exited.
          # Publication credentials are only introduced in this step.
          git clone --no-checkout "https://github.com/$REPOSITORY.git" "$publish_dir"
          cd "$publish_dir"
          git checkout --detach "$BASE_SHA"
          git checkout -B "$BRANCH"
          git apply --index "$RUNNER_TEMP/agent.patch"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          empty_hooks="$RUNNER_TEMP/agent-empty-hooks"
          mkdir -p "$empty_hooks"

          git -c core.hooksPath="$empty_hooks" commit             -m "feat(agent): implement design PR #$DESIGN_PR"

          git remote set-url origin "https://github.com/$REPOSITORY.git"

          auth="$(
            printf 'x-access-token:%s' "$GITHUB_TOKEN"               | base64               | tr -d '\n'
          )"

          GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1             git               -c core.hooksPath="$empty_hooks"               -c credential.helper=               -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth"               push --force origin "HEAD:refs/heads/$BRANCH"

          result="$(
            python3 scripts/agent/github_api.py publish               --repo "$REPOSITORY"               --design-pr "$DESIGN_PR"               --design-sha "$DESIGN_HEAD"               --branch "$BRANCH"               --base main
          )"

          printf '%s\n' "$result"
          printf 'Implementation publication: `%s`\n' "$result" >> "$GITHUB_STEP_SUMMARY"
