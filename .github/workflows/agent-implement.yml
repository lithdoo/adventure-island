name: Agent Implement

on:
  workflow_run:
    workflows: ["Agent Spec Gate"]
    types: [completed]

concurrency:
  group: agent-implement-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  preflight:
    name: Revalidate and package trusted inputs
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      allowed: ${{ steps.validate.outputs.allowed }}
      pr_number: ${{ steps.validate.outputs.pr_number }}
      spec_path: ${{ steps.validate.outputs.spec_path }}
      head_sha: ${{ steps.validate.outputs.head_sha }}
      base_sha: ${{ steps.base.outputs.sha }}

    steps:
      - name: Checkout trusted main with read-only submodule context
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          persist-credentials: false

      - name: Record trusted implementation base
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Revalidate PR and task
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          echo "allowed=false" >> "$GITHUB_OUTPUT"

          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          trigger_head="$(jq -r '.workflow_run.pull_requests[0].head.sha // empty' "$GITHUB_EVENT_PATH")"

          if [[ -z "$pr_number" ]]; then
            echo "No pull request is associated with the completed gate run."
            exit 0
          fi

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"

          state="$(jq -r '.state' <<<"$pr_json")"
          draft="$(jq -r '.draft' <<<"$pr_json")"
          author="$(jq -r '.user.login' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          changed_files="$(jq -r '.changed_files' <<<"$pr_json")"

          if [[ "$state" != "open" || "$draft" != "false" ]]; then
            echo "Design PR is no longer open and ready."
            exit 0
          fi
          if [[ "$author" != "$REPOSITORY_OWNER" || "$head_repo" != "$REPOSITORY" ]]; then
            echo "Design PR is not an owner-authored same-repository PR."
            exit 0
          fi
          if [[ "$base_ref" != "main" ]]; then
            echo "Design PR no longer targets main."
            exit 0
          fi
          if [[ -n "$trigger_head" && "$trigger_head" != "$head_sha" ]]; then
            echo "Ignoring stale gate run for $trigger_head; current head is $head_sha."
            exit 0
          fi
          if [[ "$changed_files" != "1" ]]; then
            echo "Design PR must change exactly one file."
            exit 0
          fi

          spec_path="$(
            gh api "repos/$REPOSITORY/pulls/$pr_number/files?per_page=100" \
              --jq '.[0].filename'
          )"

          if [[ ! "$spec_path" =~ ^task/dev/[^/]+\.md$ || "$spec_path" == "task/dev/README.md" ]]; then
            echo "Unexpected design path: $spec_path"
            exit 0
          fi

          gh api "repos/$REPOSITORY/contents/$spec_path?ref=$head_sha" \
            --jq '.content' \
            | tr -d '\n' \
            | base64 --decode \
            > "$RUNNER_TEMP/agent-spec.md"

          python3 scripts/agent/validate_spec.py "$RUNNER_TEMP/agent-spec.md"

          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "spec_path=$spec_path" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Stage trusted source snapshot
        if: ${{ steps.validate.outputs.allowed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/agent-source"
          mkdir -p "$RUNNER_TEMP/agent-source"
          rsync -a --exclude='.git' ./ "$RUNNER_TEMP/agent-source/"

      - name: Upload trusted source snapshot
        if: ${{ steps.validate.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-source
          path: ${{ runner.temp }}/agent-source
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload approved design document
        if: ${{ steps.validate.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-spec
          path: ${{ runner.temp }}/agent-spec.md
          if-no-files-found: error
          retention-days: 1

  implement:
    name: Implement with container OpenCode
    needs: preflight
    if: ${{ needs.preflight.outputs.allowed == 'true' }}
    runs-on: [self-hosted, opencode, adventure-island]
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    env:
      OPENCODE_BIN: opencode2

    steps:
      - name: Reset isolated agent directories
        shell: bash
        run: |
          set -euo pipefail
          for name in agent-workspace agent-input agent-output trusted-agent; do
            path="$RUNNER_TEMP/$name"
            rm -rf "$path"
            mkdir -p "$path"
          done

      - name: Download trusted source snapshot
        uses: actions/download-artifact@v4
        with:
          name: agent-source
          path: ${{ runner.temp }}/agent-workspace

      - name: Download approved design document
        uses: actions/download-artifact@v4
        with:
          name: agent-spec
          path: ${{ runner.temp }}/agent-input

      - name: Create local baseline and trusted verifier snapshot
        shell: bash
        working-directory: ${{ runner.temp }}/agent-workspace
        run: |
          set -euo pipefail

          git init
          git config user.name "agent-baseline"
          git config user.email "agent-baseline@localhost"
          git add -f -A
          git commit -m "agent trusted baseline"

          trusted="$RUNNER_TEMP/trusted-agent"
          cp -a scripts/agent/. "$trusted/"

          if [[ -e ".raw" ]]; then
            echo ".raw must not exist inside the self-hosted agent workspace." >&2
            exit 1
          fi

      - name: Verify container OpenCode
        shell: bash
        working-directory: ${{ runner.temp }}/agent-workspace
        run: |
          set -euo pipefail

          command -v "$OPENCODE_BIN" >/dev/null

          set +e
          version_output="$("$OPENCODE_BIN" --version 2>&1)"
          version_status=$?
          set -e

          if [[ $version_status -ne 0 ]]; then
            printf '%s\n' "$version_output" | sed -n '1,5p' >&2
            exit "$version_status"
          fi

          if [[ -z "${GLM_API_KEY:-}" ]]; then
            echo "GLM_API_KEY is not visible to the container runner." >&2
            exit 1
          fi

          if [[ -z "${OPENCODE_CONFIG:-}" || ! -r "$OPENCODE_CONFIG" ]]; then
            echo "Trusted OpenCode config is not readable in the container runner." >&2
            exit 1
          fi

          echo "Using container OpenCode: $(printf '%s\n' "$version_output" | sed -n '1p')"
          echo "GLM_API_KEY visible: True"

      - name: Run OpenCode implementation
        shell: bash
        working-directory: ${{ runner.temp }}/agent-workspace
        env:
          DESIGN_PR: ${{ needs.preflight.outputs.pr_number }}
        run: |
          set -euo pipefail
          runner="$RUNNER_TEMP/trusted-agent/run-opencode.sh"
          spec="$RUNNER_TEMP/agent-input/agent-spec.md"

          bash "$runner" "$spec" "$DESIGN_PR"

      - name: Verify agent output
        shell: bash
        working-directory: ${{ runner.temp }}/agent-workspace
        run: |
          set -euo pipefail
          verifier="$RUNNER_TEMP/trusted-agent/verify.sh"
          spec="$RUNNER_TEMP/agent-input/agent-spec.md"

          bash "$verifier" "$spec"

      - name: Materialize verified patch
        shell: bash
        working-directory: ${{ runner.temp }}/agent-workspace
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/agent-output/agent.patch"

          git add -N -- .
          git diff --binary --output="$patch" HEAD --

          if [[ ! -s "$patch" ]]; then
            echo "Verified agent patch is empty." >&2
            exit 1
          fi

      - name: Upload verified patch
        uses: actions/upload-artifact@v4
        with:
          name: agent-patch
          path: ${{ runner.temp }}/agent-output/agent.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish implementation PR
    needs: [preflight, implement]
    if: ${{ needs.preflight.outputs.allowed == 'true' && needs.implement.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
      - name: Checkout trusted implementation base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified patch
        uses: actions/download-artifact@v4
        with:
          name: agent-patch
          path: ${{ runner.temp }}/agent-output

      - name: Apply patch and publish
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          DESIGN_PR: ${{ needs.preflight.outputs.pr_number }}
          DESIGN_HEAD: ${{ needs.preflight.outputs.head_sha }}
          BRANCH: agent/pr-${{ needs.preflight.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          git checkout -B "$BRANCH"
          git apply --index "$RUNNER_TEMP/agent-output/agent.patch"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(agent): implement design PR #$DESIGN_PR"

          auth="$(
            printf 'x-access-token:%s' "$GITHUB_TOKEN" \
              | base64 \
              | tr -d '\n'
          )"

          GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
            git \
              -c credential.helper= \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
              push --force origin "HEAD:refs/heads/$BRANCH"

          result="$(
            python3 scripts/agent/github_api.py publish \
              --repo "$REPOSITORY" \
              --design-pr "$DESIGN_PR" \
              --design-sha "$DESIGN_HEAD" \
              --branch "$BRANCH" \
              --base main
          )"

          printf '%s\n' "$result"
          printf 'Implementation publication: `%s`\n' "$result" >> "$GITHUB_STEP_SUMMARY"
