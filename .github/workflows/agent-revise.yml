name: Agent Revise

on:
  issue_comment:
    types: [created]

concurrency:
  group: agent-revise-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  preflight:
    name: Validate trusted revision request
    if: ${{ github.event.issue.pull_request != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      allowed: ${{ steps.validate.outputs.allowed }}
      implementation_pr: ${{ steps.validate.outputs.implementation_pr }}
      implementation_head: ${{ steps.validate.outputs.implementation_head }}
      implementation_branch: ${{ steps.validate.outputs.implementation_branch }}
      design_pr: ${{ steps.validate.outputs.design_pr }}
      design_head: ${{ steps.validate.outputs.design_head }}
      spec_path: ${{ steps.validate.outputs.spec_path }}

    steps:
      - name: Checkout trusted workflow tools
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Validate owner command, PR identity, design task, and feedback
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
          IMPLEMENTATION_PR: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          echo "allowed=false" >> "$GITHUB_OUTPUT"

          command="$(printf '%s' "$COMMENT_BODY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ "$command" != "/agent revise" ]]; then
            echo "Ignoring non-agent command."
            exit 0
          fi
          if [[ "$COMMENT_AUTHOR" != "$REPOSITORY_OWNER" ]]; then
            echo "Only the repository owner may request an agent revision."
            exit 0
          fi

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$IMPLEMENTATION_PR")"
          state="$(jq -r '.state' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"

          if [[ "$state" != "open" || "$head_repo" != "$REPOSITORY" || "$base_ref" != "main" ]]; then
            echo "Implementation PR is not an open same-repository PR targeting main."
            exit 0
          fi
          if [[ ! "$head_ref" =~ ^agent/pr-([0-9]+)$ ]]; then
            echo "Implementation PR head is not an agent/pr-N branch: $head_ref"
            exit 0
          fi
          design_pr="${BASH_REMATCH[1]}"

          design_json="$(gh api "repos/$REPOSITORY/pulls/$design_pr")"
          design_state="$(jq -r '.state' <<<"$design_json")"
          design_draft="$(jq -r '.draft' <<<"$design_json")"
          design_author="$(jq -r '.user.login' <<<"$design_json")"
          design_repo="$(jq -r '.head.repo.full_name' <<<"$design_json")"
          design_base="$(jq -r '.base.ref' <<<"$design_json")"
          design_head="$(jq -r '.head.sha' <<<"$design_json")"
          changed_files="$(jq -r '.changed_files' <<<"$design_json")"

          if [[ "$design_state" != "open" || "$design_draft" != "false" ]]; then
            echo "Design PR #$design_pr is no longer open and ready."
            exit 0
          fi
          if [[ "$design_author" != "$REPOSITORY_OWNER" || "$design_repo" != "$REPOSITORY" || "$design_base" != "main" ]]; then
            echo "Design PR #$design_pr no longer satisfies the trusted-owner policy."
            exit 0
          fi
          if [[ "$changed_files" != "1" ]]; then
            echo "Design PR #$design_pr must still change exactly one file."
            exit 0
          fi

          spec_path="$(
            gh api "repos/$REPOSITORY/pulls/$design_pr/files?per_page=100" --jq '.[0].filename'
          )"
          if [[ ! "$spec_path" =~ ^task/dev/[^/]+\.md$ || "$spec_path" == "task/dev/README.md" ]]; then
            echo "Unexpected design path: $spec_path"
            exit 0
          fi

          gh api "repos/$REPOSITORY/contents/$spec_path?ref=$design_head" \
            --jq '.content' \
            | tr -d '\n' \
            | base64 --decode \
            > "$RUNNER_TEMP/agent-spec.md"
          python3 trusted/scripts/agent/validate_spec.py "$RUNNER_TEMP/agent-spec.md"

          feedback_json="$(
            python3 trusted/scripts/agent/github_api.py collect-feedback \
              --repo "$REPOSITORY" \
              --implementation-pr "$IMPLEMENTATION_PR" \
              --owner "$REPOSITORY_OWNER" \
              --trigger-comment-id "$COMMENT_ID" \
              --output "$RUNNER_TEMP/agent-feedback.md"
          )"
          feedback_count="$(jq -r '.count' <<<"$feedback_json")"
          if [[ "$feedback_count" == "0" ]]; then
            echo "No new owner-authored review feedback exists after the previous agent turn."
            exit 0
          fi

          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "implementation_pr=$IMPLEMENTATION_PR" >> "$GITHUB_OUTPUT"
          echo "implementation_head=$head_sha" >> "$GITHUB_OUTPUT"
          echo "implementation_branch=$head_ref" >> "$GITHUB_OUTPUT"
          echo "design_pr=$design_pr" >> "$GITHUB_OUTPUT"
          echo "design_head=$design_head" >> "$GITHUB_OUTPUT"
          echo "spec_path=$spec_path" >> "$GITHUB_OUTPUT"
          printf 'Trusted revision: implementation PR #%s -> design PR #%s; feedback items: %s\n' \
            "$IMPLEMENTATION_PR" "$design_pr" "$feedback_count" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout current Implementation PR head
        if: ${{ steps.validate.outputs.allowed == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.validate.outputs.implementation_head }}
          path: source
          submodules: recursive
          persist-credentials: false

      - name: Stage trusted revision source and tools
        if: ${{ steps.validate.outputs.allowed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/agent-source" "$RUNNER_TEMP/agent-tools"
          mkdir -p "$RUNNER_TEMP/agent-source" "$RUNNER_TEMP/agent-tools"
          rsync -a --exclude='.git' source/ "$RUNNER_TEMP/agent-source/"
          cp -a trusted/scripts/agent/. "$RUNNER_TEMP/agent-tools/"

      - name: Upload current implementation source
        if: ${{ steps.validate.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: revision-source
          path: ${{ runner.temp }}/agent-source
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload trusted agent tools
        if: ${{ steps.validate.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: revision-tools
          path: ${{ runner.temp }}/agent-tools
          if-no-files-found: error
          retention-days: 1

      - name: Upload approved design and trusted review feedback
        if: ${{ steps.validate.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: revision-input
          path: |
            ${{ runner.temp }}/agent-spec.md
            ${{ runner.temp }}/agent-feedback.md
          if-no-files-found: error
          retention-days: 1

  revise:
    name: Revise with persistent OpenCode session
    needs: preflight
    if: ${{ needs.preflight.outputs.allowed == 'true' }}
    runs-on: [self-hosted, opencode, adventure-island]
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    env:
      OPENCODE_BIN: opencode2
      XDG_DATA_HOME: /runner/state/adventure-island/opencode-data
      AGENT_SESSION_ROOT: /runner/state/adventure-island/agent-sessions/design-${{ needs.preflight.outputs.design_pr }}
      AGENT_WORKSPACE: /runner/state/adventure-island/agent-sessions/design-${{ needs.preflight.outputs.design_pr }}/workspace

    steps:
      - name: Reset transient revision directories
        shell: bash
        run: |
          set -euo pipefail
          for name in revision-source revision-input revision-output trusted-agent; do
            path="$RUNNER_TEMP/$name"
            rm -rf "$path"
            mkdir -p "$path"
          done
          mkdir -p "$XDG_DATA_HOME" "$AGENT_SESSION_ROOT"

      - name: Download current implementation source
        uses: actions/download-artifact@v4
        with:
          name: revision-source
          path: ${{ runner.temp }}/revision-source

      - name: Download trusted agent tools
        uses: actions/download-artifact@v4
        with:
          name: revision-tools
          path: ${{ runner.temp }}/trusted-agent

      - name: Download approved design and trusted review feedback
        uses: actions/download-artifact@v4
        with:
          name: revision-input
          path: ${{ runner.temp }}/revision-input

      - name: Prepare stable session workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$AGENT_WORKSPACE"
          mkdir -p "$AGENT_WORKSPACE"
          cp -a "$RUNNER_TEMP/revision-source/." "$AGENT_WORKSPACE/"

          cd "$AGENT_WORKSPACE"
          git init
          git config user.name "agent-baseline"
          git config user.email "agent-baseline@localhost"
          git add -f -A
          git commit -m "agent revision baseline"

          if [[ -e ".raw" ]]; then
            echo ".raw must not exist inside the self-hosted agent workspace." >&2
            exit 1
          fi

      - name: Verify container OpenCode
        shell: bash
        run: |
          set -euo pipefail
          command -v "$OPENCODE_BIN" >/dev/null
          "$OPENCODE_BIN" --version
          test -n "${GLM_API_KEY:-}"
          test -n "${OPENCODE_CONFIG:-}"
          test -r "$OPENCODE_CONFIG"
          mkdir -p "$XDG_DATA_HOME"
          echo "GLM_API_KEY visible: True"

      - name: Run OpenCode revision turn
        id: opencode
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "$AGENT_WORKSPACE"
          bash "$RUNNER_TEMP/trusted-agent/run-opencode.sh" \
            --mode revise \
            --spec "$RUNNER_TEMP/revision-input/agent-spec.md" \
            --feedback "$RUNNER_TEMP/revision-input/agent-feedback.md" \
            --design-pr "${{ needs.preflight.outputs.design_pr }}" \
            --design-head "${{ needs.preflight.outputs.design_head }}" \
            --session-root "$AGENT_SESSION_ROOT" \
            --output-dir "$RUNNER_TEMP/revision-output"

      - name: Verify candidate revision
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          cd "$AGENT_WORKSPACE"
          result="$RUNNER_TEMP/revision-output/run-result.json"
          log="$RUNNER_TEMP/revision-output/verification.log"
          mapfile -t runtime_values < <(
            python3 - "$result" <<'PY'
import json
import sys

try:
    value = json.load(open(sys.argv[1], encoding="utf-8"))
except (OSError, json.JSONDecodeError):
    value = {}
print(value.get("runtimeStatus") or "failed")
print(value.get("runtimeExitCode") if value.get("runtimeExitCode") is not None else 1)
PY
          )
          runtime_status="${runtime_values[0]:-failed}"
          runtime_code="${runtime_values[1]:-1}"
          changed_count="$({ git diff --name-only HEAD --; git ls-files --others --exclude-standard; } | awk 'NF' | sort -u | wc -l | tr -d ' ')"

          verification=skipped
          if [[ "$runtime_status" == "completed" && "$runtime_code" == "0" && "$changed_count" != "0" ]]; then
            set +e
            bash "$RUNNER_TEMP/trusted-agent/verify.sh" "$RUNNER_TEMP/revision-input/agent-spec.md" >"$log" 2>&1
            verify_status=$?
            set -e
            cat "$log"
            if [[ $verify_status -eq 0 ]]; then
              verification=passed
            else
              verification=failed
            fi
          else
            printf 'verification skipped: runtime=%s exit=%s changed=%s\n' \
              "$runtime_status" "$runtime_code" "$changed_count" | tee "$log"
          fi
          echo "verification=$verification" >> "$GITHUB_OUTPUT"

      - name: Finalize revision result
        id: result
        shell: bash
        run: |
          set -euo pipefail
          cd "$AGENT_WORKSPACE"
          python3 "$RUNNER_TEMP/trusted-agent/finalize_result.py" \
            --run-result "$RUNNER_TEMP/revision-output/run-result.json" \
            --verification "${{ steps.verify.outputs.verification }}" \
            --verification-log "$RUNNER_TEMP/revision-output/verification.log" \
            --output "$RUNNER_TEMP/revision-output/agent-result.json"
          status="$(
            python3 - "$RUNNER_TEMP/revision-output/agent-result.json" <<'PY'
import json
import sys
print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])
PY
          )"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Materialize verified revision patch
        if: ${{ steps.result.outputs.status == 'verified' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$AGENT_WORKSPACE"
          patch="$RUNNER_TEMP/revision-output/agent.patch"
          git add -N -- .
          git diff --binary --output="$patch" HEAD --
          test -s "$patch"

      - name: Upload revision result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: revision-result
          path: ${{ runner.temp }}/revision-output/agent-result.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload verified revision patch
        if: ${{ steps.result.outputs.status == 'verified' }}
        uses: actions/upload-artifact@v4
        with:
          name: revision-patch
          path: ${{ runner.temp }}/revision-output/agent.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish revision result
    needs: [preflight, revise]
    if: ${{ always() && needs.preflight.outputs.allowed == 'true' && needs.revise.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Checkout exact Implementation PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.implementation_head }}
          path: work
          fetch-depth: 0
          persist-credentials: false

      - name: Download revision result
        uses: actions/download-artifact@v4
        with:
          name: revision-result
          path: ${{ runner.temp }}/revision-output

      - name: Inspect revision result
        id: result
        shell: bash
        run: |
          set -euo pipefail
          status="$(jq -r '.status' "$RUNNER_TEMP/revision-output/agent-result.json")"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Download verified revision patch
        if: ${{ steps.result.outputs.status == 'verified' }}
        uses: actions/download-artifact@v4
        with:
          name: revision-patch
          path: ${{ runner.temp }}/revision-output

      - name: Apply and push verified revision
        if: ${{ steps.result.outputs.status == 'verified' }}
        id: push
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          BRANCH: ${{ needs.preflight.outputs.implementation_branch }}
          DESIGN_PR: ${{ needs.preflight.outputs.design_pr }}
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "$BRANCH"
          git apply --index "$RUNNER_TEMP/revision-output/agent.patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(agent): revise design PR #$DESIGN_PR"
          commit_sha="$(git rev-parse HEAD)"

          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
            git \
              -c credential.helper= \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
              push origin "HEAD:refs/heads/$BRANCH"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Comment revision result on Implementation PR
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          IMPLEMENTATION_PR: ${{ needs.preflight.outputs.implementation_pr }}
          STATUS: ${{ steps.result.outputs.status }}
          COMMIT_SHA: ${{ steps.push.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            comment-result
            --repo "$REPOSITORY"
            --issue "$IMPLEMENTATION_PR"
            --result "$RUNNER_TEMP/revision-output/agent-result.json"
            --phase "review revision"
          )
          if [[ -n "$COMMIT_SHA" ]]; then
            args+=(--commit-sha "$COMMIT_SHA")
          fi
          python3 trusted/scripts/agent/github_api.py "${args[@]}"
