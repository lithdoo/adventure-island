name: Agent Spec Gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - "task/dev/*.md"
      - "!task/dev/README.md"

concurrency:
  group: agent-spec-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    name: Validate design-only agent task
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify trusted PR identity
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        shell: bash
        run: |
          set -euo pipefail
          test "$IS_DRAFT" = "false"
          test "$PR_AUTHOR" = "$REPOSITORY_OWNER"
          test "$ACTOR" = "$REPOSITORY_OWNER"
          test "$PR_HEAD_REPO" = "$REPOSITORY"

      - name: Inspect PR files and fetch design document
        id: spec
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          changed_files="$(jq -r '.changed_files' <<<"$pr_json")"
          test "$changed_files" = "1"

          spec_path="$(
            gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100"               --jq '.[0].filename'
          )"

          [[ "$spec_path" =~ ^task/dev/[^/]+\.md$ ]]
          test "$spec_path" != "task/dev/README.md"

          gh api "repos/$REPOSITORY/contents/$spec_path?ref=$HEAD_SHA"             --jq '.content'             | tr -d '\n'             | base64 --decode             > "$RUNNER_TEMP/agent-spec.md"

          printf 'spec_path=%s\n' "$spec_path" >> "$GITHUB_OUTPUT"
          printf 'Design task: `%s`\n' "$spec_path" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout trusted validator from PR base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Validate task contract
        run: python3 scripts/agent/validate_spec.py "$RUNNER_TEMP/agent-spec.md"
