name: WZ FSDB synthetic regressions

on:
  pull_request:
    paths:
      - 'scripts/wz_fsdb/**'
      - 'tests/wz_fsdb/**'
      - 'result/64-wz-fsdb-*.json'
      - '.github/workflows/wz-fsdb-synthetic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthetic-only dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Verify no WZ/client assets exist in test checkout
        shell: bash
        run: |
          if find . -type f \( -iname '*.wz' -o -iname '*.exe' -o -iname '*.dll' \) -print -quit | grep -q .; then
            echo "Blocked: WZ/client binaries must not be committed"
            exit 1
          fi
      - name: Run synthetic conversion regressions
        run: python -m unittest discover -s tests/wz_fsdb -v
